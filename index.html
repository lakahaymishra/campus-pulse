    const audioHelper = {
      ctx: null,
      getCtx() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      },
      playChime(type = 'success') {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          if (type === 'success') {
            osc.frequency.setValueAtTime(659.25, now); // E5
            osc.frequency.setValueAtTime(987.77, now + 0.1); // B5
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          } else if (type === 'reminder') {
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15); // G5
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          } else {
            osc.frequency.setValueAtTime(320, now);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          }

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } catch (e) {}
      }
    };

    // ==========================================
    // 4. SMART HEURISTIC & GEMINI EXTRACTION
    // ==========================================
    function parseWithRuleEngine(rawText) {
      const text = (rawText || "").trim();
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      const lower = text.toLowerCase();
      const missingFields = [];

      // Category detection
      let category = "General";
      if (/exam|midsem|endsem|hall ticket|admit card|coe|re-eval|grades|marksheet|timetable/i.test(lower)) {
        category = "Examination";
      } else if (/placement|internship|ctc|lpa|stipend|interview|t&p|recruitment|hiring|drive|resume/i.test(lower)) {
        category = "Placement";
      } else if (/sports|football|badminton|cricket|basketball|tournament|athletics|jersey|trials/i.test(lower)) {
        category = "Sports";
      } else if (/cultural|fest|band|music|dance|singing|drama|spandan|amphitheatre|audition/i.test(lower)) {
        category = "Cultural";
      } else if (/hackathon|workshop|seminar|webinar|conference|techfest|summit|hackpulse/i.test(lower)) {
        category = "Events";
      } else if (/assignment|lecture|syllabus|course|homework|lab|quiz|submission|jupyter/i.test(lower)) {
        category = "Academic";
      }

      // Priority detection
      let priority = "Normal";
      if (/urgent|critical|mandatory|strict|penalty|today only|last date today|warning|suspended/i.test(lower)) {
        priority = "Urgent";
      } else if (/deadline|important|registration closes|last date|examination|internship/i.test(lower)) {
        priority = "High";
      }

      // Title detection
      let title = "";
      const validLine = lines.find(l => {
        const clean = l.replace(/^[🚨📢🚀🏆🎸⚠️\s*#_-]+/, '').trim();
        return clean.length > 5 && !/^(fwd:|to:|subject:|greetings|hey everyone|reminder:)/i.test(clean);
      });
      if (validLine) {
        title = validLine.replace(/^[🚨📢🚀🏆🎸⚠️\s*#_-]+/, '').replace(/[🚨📢🚀🏆🎸⚠️\s*#_-]+$/, '').replace(/^\*(.*?)\*$/, '$1').trim();
        if (title.length > 80) title = title.substring(0, 77) + "...";
      } else {
        title = lines[0] ? lines[0].substring(0, 60) : "New Campus Announcement";
      }

      // Date detection
      let date = "";
      const dateRegex = /(?:(\d{1,2})(?:st|nd|rd|th)?\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)(?:\s*,?\s*(\d{4}))?)|(?:(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(\d{1,2})(?:st|nd|rd|th)?(?:\s*,?\s*(\d{4}))?)|(\d{4}-\d{2}-\d{2})/i;
      const dateMatch = text.match(dateRegex);
      const mNums = {
        jan: "01", january: "01", feb: "02", february: "02", mar: "03", march: "03",
        apr: "04", april: "04", may: "05", jun: "06", june: "06", jul: "07", july: "07",
        aug: "08", august: "08", sep: "09", september: "09", oct: "10", october: "10",
        nov: "11", november: "11", dec: "12", december: "12"
      };

      if (dateMatch) {
        if (dateMatch[7]) {
          date = dateMatch[7];
        } else if (dateMatch[1] && dateMatch[2]) {
          const d = dateMatch[1].padStart(2, '0');
          const m = mNums[dateMatch[2].toLowerCase()] || "11";
          const y = dateMatch[3] || "2026";
          date = `${y}-${m}-${d}`;
        } else if (dateMatch[4] && dateMatch[5]) {
          const d = dateMatch[5].padStart(2, '0');
          const m = mNums[dateMatch[4].toLowerCase()] || "11";
          const y = dateMatch[6] || "2026";
          date = `${y}-${m}-${d}`;
        }
      } else if (/today/i.test(text)) {
        date = "2026-10-31";
      } else if (/tomorrow/i.test(text)) {
        date = "2026-11-01";
      }

      if (!date) missingFields.push("Date");

      // Time detection
      let time = "";
      const timeRegex = /(\b\d{1,2}(?::\d{2})?\s*(?:AM|PM|am|pm)(?:\s*(?:to|-|–)\s*\d{1,2}(?::\d{2})?\s*(?:AM|PM|am|pm))?|\b\d{1,2}:\d{2}\s*(?:hrs|hours|IST)?)/i;
      const timeMatch = text.match(timeRegex);
      if (timeMatch) time = timeMatch[0].trim();
      else missingFields.push("Time");

      // Venue detection
      let venue = "";
      const venueRegex = /(?:venue|location|place|held at)\s*[:\-]?\s*([^\n,.]+)|(?:in\s+(?:the\s+)?([A-Z][a-zA-Z0-9\s&]+(?:Hall|Auditorium|Audi|Block|Lab|Room|Stadium|Complex|Hub|Center|Amphitheatre)))/i;
      const venueMatch = text.match(venueRegex);
      if (venueMatch) {
        venue = (venueMatch[1] || venueMatch[2] || "").trim().replace(/^[*_~:\s]+|[*_~:\s]+$/g, '');
      } else if (/github classroom|lms portal|online|zoom|google meet/i.test(text)) {
        venue = "LMS / GitHub Classroom";
      } else {
        missingFields.push("Venue");
      }

      // Deadline detection
      let deadline = "";
      const deadlineRegex = /(?:deadline|last date|register(?:ation)? closes?(?: on)?|submit by|due (?:on)?)\s*[:\-]?\s*([^\n.]+)/i;
      const dlMatch = text.match(deadlineRegex);
      if (dlMatch) {
        const dlInner = dlMatch[1].match(dateRegex);
        if (dlInner) {
          if (dlInner[7]) deadline = dlInner[7];
          else if (dlInner[1] && dlInner[2]) {
            const d = dlInner[1].padStart(2, '0');
            const m = mNums[dlInner[2].toLowerCase()] || "11";
            deadline = `${dlInner[3] || "2026"}-${m}-${d}`;
          } else if (dlInner[4] && dlInner[5]) {
            const d = dlInner[5].padStart(2, '0');
            const m = mNums[dlInner[4].toLowerCase()] || "11";
            deadline = `${dlInner[6] || "2026"}-${m}-${d}`;
          }
        } else if (/today/i.test(dlMatch[1])) {
          deadline = "2026-10-31";
        }
      }

      // Description cleanup
      let description = lines
        .filter(l => !l.startsWith("📢") && !l.startsWith("🚨") && !l.startsWith("Fwd:") && !l.toLowerCase().startsWith("to: all"))
        .join(" ")
        .replace(/\s+/g, ' ')
        .trim();
      if (description.length > 280) description = description.substring(0, 277) + "...";
      if (!description) description = text.substring(0, 200);

      // Contact & Organizer
      let contactInfo = "";
      const email = text.match(/[\w.-]+@[\w.-]+\.\w+/);
      const phone = text.match(/(?:\+91[-\s]?)?[6-9]\d{9}/);
      if (email || phone) contactInfo = [email ? email[0] : null, phone ? phone[0] : null].filter(Boolean).join(" | ");

      let organizer = "";
      if (/examination cell|coe/i.test(text)) organizer = "Examination Cell";
      else if (/placement|t&p/i.test(text)) organizer = "Training & Placement Cell";
      else if (/developer student club|csi/i.test(text)) organizer = "Developer Student Club";
      else if (/sports council/i.test(text)) organizer = "Sports Council";
      else if (/cultural society|music club/i.test(text)) organizer = "Cultural Society";
      else if (/library/i.test(text)) organizer = "Central Library";

      return {
        title: title || "New Announcement",
        category,
        date: date || "",
        time: time || "",
        venue: venue || "",
        description,
        deadline: deadline || "",
        priority,
        organizer: organizer || "",
        contactInfo: contactInfo || "",
        missingFields,
        engineUsed: "Smart Rule-Based NLP Engine (Demo Mode)",
        isLiveLLM: false
      };
    }

    async function extractNotice(rawText, apiKey) {
      const trimmedKey = (apiKey || "").trim();
      if (!trimmedKey) {
        await new Promise(r => setTimeout(r, 650));
        return parseWithRuleEngine(rawText);
      }

      try {
        const prompt = `You are an AI assistant for "Campus Pulse", an intelligent campus information hub.
Extract structured college notice information into strict JSON.
Rules:
- Do NOT hallucinate missing details. If missing, set to null.
- Category must be one of: "Academic", "Events", "Sports", "Cultural", "Placement", "Examination", "General".
- Priority must be one of: "Urgent", "High", "Normal", "Low".
- Date format YYYY-MM-DD or null.
- Format:
{
  "title": "string",
  "category": "string",
  "date": "YYYY-MM-DD or null",
  "time": "string or null",
  "venue": "string or null",
  "description": "clean summary",
  "deadline": "YYYY-MM-DD or null",
  "priority": "Urgent|High|Normal|Low",
  "organizer": "string or null",
  "contactInfo": "string or null",
  "missingFields": ["names of missing fields"]
}
Text:
${rawText}`;

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${trimmedKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.1, responseMimeType: "application/json" }
          })
        });

        if (!res.ok) {
          const fallback = parseWithRuleEngine(rawText);
          fallback.apiNotice = `Gemini API returned status ${res.status}. Switched to Smart Heuristic Engine.`;
          return fallback;
        }

        const data = await res.json();
        const content = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        const parsed = JSON.parse(content);
        return {
          title: parsed.title || "Announcement",
          category: parsed.category || "General",
          date: parsed.date || "",
          time: parsed.time || "",
          venue: parsed.venue || "",
          description: parsed.description || rawText.substring(0, 200),
          deadline: parsed.deadline || "",
          priority: parsed.priority || "Normal",
          organizer: parsed.organizer || "",
          contactInfo: parsed.contactInfo || "",
          missingFields: parsed.missingFields || [],
          engineUsed: "Google Gemini 1.5 Flash (Live AI Connected)",
          isLiveLLM: true
        };
      } catch (e) {
        console.warn("AI LLM failed, fallback to heuristics:", e);
        const fallback = parseWithRuleEngine(rawText);
        fallback.apiNotice = `Live AI error (${e.message}). Used Smart Heuristics Engine.`;
        return fallback;
      }
    }

    // ==========================================
    // 5. CALENDAR ICS GENERATOR
    // ==========================================
    function downloadICS(notice) {
      const sanitize = (str) => (str || "").replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
      const dateStr = (notice.date || "2026-11-01").replace(/-/g, '');
      const dtStamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const uid = `${notice.id || Date.now()}@campuspulse.edu`;

      const ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Campus Pulse//Campus Announcements//EN',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        `UID:${uid}`,
        `DTSTAMP:${dtStamp}`,
        `DTSTART:${dateStr}T090000Z`,
        `DTEND:${dateStr}T110000Z`,
        `SUMMARY:${sanitize(notice.title)}`,
        `DESCRIPTION:${sanitize(notice.description)} [Organized by: ${sanitize(notice.organizer || "College Administration")}]`,
        `LOCATION:${sanitize(notice.venue || "Campus")}`,
        `CATEGORIES:${notice.category || "General"}`,
        'BEGIN:VALARM',
        'TRIGGER:-PT2H',
        'ACTION:DISPLAY',
        `DESCRIPTION:Reminder: ${sanitize(notice.title)} in 2 hours`,
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `event-${(notice.title || "notice").toLowerCase().replace(/[^a-z0-9]/g, '-').slice(0, 30)}.ics`;
      a.click();
      URL.revokeObjectURL(url);
    }

          return {
            geminiApiKey: "",
            universityName: "Apex Institute of Technology",
            studentName: "Alex Morgan",
            studentProgram: "B.Tech Computer Science (Sem 5)",
            soundEnabled: true,
            themeBackground: "aurora"

      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [selectedPriority, setSelectedPriority] = useState("All");
      const [selectedStatus, setSelectedStatus] = useState("All"); // All, Active, Today, Expired

      const [noticeToEdit, setNoticeToEdit] = useState(null);

      // Apply theme background class to body
      useEffect(() => {
        const theme = settings.themeBackground || 'aurora';
        document.body.className = `theme-${theme} text-slate-100 min-h-screen antialiased selection:bg-brand-500 selection:text-white`;

      // Save notices to localStorage on change
      useEffect(() => {
        try {

      useEffect(() => {

      // Helper for Toast Notifications
      const addToast = (message, type = "success", duration = 4000) => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        if (settings.soundEnabled) {
          audioHelper.playChime(type === "reminder" ? "reminder" : "success");
        }
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, duration);
      };

      // Metrics calculation
      const metrics = useMemo(() => {
        const today = CURRENT_DATE_STR;
        let upcoming = 0;
        let urgent = 0;
        let expired = 0;
        let todayCount = 0;

        notices.forEach(n => {
          if (n.priority === "Urgent") urgent++;
          if (n.date === today) todayCount++;
          if (n.date && n.date > today) upcoming++;
          if (n.date && n.date < today) expired++;
        });

        return {
          total: notices.length,
          upcoming,
          urgent,
          expired,
          todayCount
        };
      }, [notices]);

      // Active reminders
      const activeReminders = useMemo(() => {
        return notices.filter(n => n.reminderSet);

      // Duplicate Notice Checker
      const checkDuplicate = (title, date, currentId = null) => {
        if (!title || !title.trim()) return null;
        const clean = title.toLowerCase().replace(/[^a-z0-9]/g, ' ').trim();
        const words = clean.split(/\s+/).filter(w => w.length > 2);

        for (const item of notices) {
          if (currentId && item.id === currentId) continue;
          const itemClean = item.title.toLowerCase().replace(/[^a-z0-9]/g, ' ').trim();
          const itemWords = itemClean.split(/\s+/).filter(w => w.length > 2);
          const intersection = words.filter(w => itemWords.includes(w));
          const union = new Set([...words, ...itemWords]);
          const similarity = union.size > 0 ? intersection.length / union.size : 0;
          const sameDate = date && item.date && item.date === date;

          if (itemClean === clean || similarity > 0.65 || (sameDate && similarity > 0.4)) {
            return {
              matched: item,
              score: Math.round(similarity * 100),
              message: sameDate
                ? `An announcement with the same date (${date}) and similar title already exists.`
                : `High title similarity (${Math.round(similarity * 100)}%) with an existing announcement.`
            };
          }
        }
        return null;
      };

      const handleToggleReminder = (id) => {

            return { ...n, reminderSet: nextVal };

            return { ...n, isBookmarked: nextVal };

      const handleDeleteNotice = (id) => {

      const handleSaveNotice = (noticeData) => {

          result = result.filter(n => 
            n.title.toLowerCase().includes(q) ||
            n.description.toLowerCase().includes(q) ||
            (n.venue && n.venue.toLowerCase().includes(q)) ||
            (n.organizer && n.organizer.toLowerCase().includes(q)) ||
            (n.tags && n.tags.some(t => t.toLowerCase().includes(q)))
          );
        }

        // Category filter
        if (selectedCategory !== "All") {
          result = result.filter(n => n.category === selectedCategory);
        }

        // Priority filter
        if (selectedPriority !== "All") {
          result = result.filter(n => n.priority === selectedPriority);
        }

        // Status filter
        if (selectedStatus === "Active") {
          result = result.filter(n => !n.date || n.date >= CURRENT_DATE_STR);
        } else if (selectedStatus === "Today") {
          result = result.filter(n => n.date === CURRENT_DATE_STR);
        } else if (selectedStatus === "Expired") {
          result = result.filter(n => n.date && n.date < CURRENT_DATE_STR);
        }

        // Sorting
        result.sort((a, b) => {
          if (sortBy === "dateAsc") {
            return (a.date || "9999") > (b.date || "9999") ? 1 : -1;
          } else if (sortBy === "dateDesc") {
            return (a.date || "0000") < (b.date || "0000") ? 1 : -1;
          } else if (sortBy === "priority") {
            const weights = { Urgent: 4, High: 3, Normal: 2, Low: 1 };
            return (weights[b.priority] || 0) - (weights[a.priority] || 0);
          } else if (sortBy === "title") {
            return a.title.localeCompare(b.title);
          }
          return 0;
        });

        return result;
      }, [notices, searchQuery, selectedCategory, selectedPriority, selectedStatus, sortBy]);

    // ==========================================
    // 7. CALENDAR VIEW COMPONENT
    // ==========================================
    function CalendarViewSection({ notices, currentDateStr, onSelectNotice, onAddNoticeForDate, getCategoryBadge }) {
      const [viewDate, setViewDate] = useState(new Date("2026-11-01"));
      const [selectedDayEvents, setSelectedDayEvents] = useState(null);

      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      // Month name
      const monthName = viewDate.toLocaleString('default', { month: 'long' });

      // First day of month & days in month
      const firstDayIndex = new Date(year, month, 1).getDay(); // 0 = Sun
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Navigate months
      const prevMonth = () => setViewDate(new Date(year, month - 1, 1));
      const nextMonth = () => setViewDate(new Date(year, month + 1, 1));
      const goToday = () => setViewDate(new Date("2026-10-31"));

      // Group notices by date (YYYY-MM-DD)
      const noticesByDate = useMemo(() => {
        const map = {};
        notices.forEach(n => {
          if (n.date) {
            if (!map[n.date]) map[n.date] = [];
            map[n.date].push(n);
          }
        });
        return map;
      }, [notices]);

      return (
        <div className="space-y-6">
          {/* Header Controls */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-display font-extrabold text-white">Campus Calendar</h2>
              <p className="text-sm text-slate-400 mt-0.5">
                Visual timeline of examinations, deadlines, hackathons, and sports events
              </p>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={goToday}
                className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 border border-slate-700"
              >
                Today (Oct 31)
              </button>
              <div className="flex items-center bg-navy-900 border border-slate-800 rounded-xl p-1">
                <button
                  onClick={prevMonth}
                  className="p-1.5 rounded-lg text-slate-400 hover:text-white"
                  title="Previous Month"
                >
                  <Icon name="chevronLeft" className="w-4 h-4" />
                </button>
                <span className="px-3 text-xs font-bold text-white min-w-[120px] text-center">
                  {monthName} {year}
                </span>
                <button
                  onClick={nextMonth}
                  className="p-1.5 rounded-lg text-slate-400 hover:text-white"
                  title="Next Month"
                >
                  <Icon name="chevronRight" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </div>

          {/* Calendar Grid */}
          <div className="rounded-2xl bg-navy-900/90 border border-slate-800 p-4 shadow-xl">
            {/* Weekday headers */}
            <div className="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-bold text-slate-400 uppercase tracking-wider">
              {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => (
                <div key={d} className="py-1">{d}</div>
              ))}
            </div>

            {/* Days grid */}
            <div className="grid grid-cols-7 gap-1.5 sm:gap-2">
              {/* Empty leading padding cells */}
              {Array.from({ length: firstDayIndex }).map((_, i) => (
                <div key={`empty-${i}`} className="min-h-[75px] sm:min-h-[95px] rounded-xl bg-slate-900/30 border border-slate-900/50 p-1 opacity-25"></div>
              ))}

              {/* Month Day Cells */}
              {Array.from({ length: daysInMonth }).map((_, i) => {
                const dayNum = i + 1;
                const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                const isToday = dStr === currentDateStr;
                const dayNotices = noticesByDate[dStr] || [];

                return (
                  <div
                    key={dStr}
                    onClick={() => {
                      if (dayNotices.length > 0) {
                        setSelectedDayEvents({ date: dStr, notices: dayNotices });
                      } else {
                        onAddNoticeForDate(dStr);
                      }
                    }}
                    className={`min-h-[75px] sm:min-h-[95px] rounded-xl p-1.5 sm:p-2 border transition-all cursor-pointer flex flex-col justify-between group ${
                      isToday
                        ? "bg-brand-950/40 border-brand-500 shadow-md shadow-brand-500/20"
                        : dayNotices.length > 0
                          ? "bg-slate-900/90 border-slate-700/80 hover:border-brand-500/50"
                          : "bg-slate-900/40 border-slate-800/60 hover:bg-slate-800/40"
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <span className={`text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center ${
                        isToday ? "bg-brand-500 text-white" : "text-slate-300 group-hover:text-white"
                      }`}>
                        {dayNum}
                      </span>
                      {dayNotices.length > 0 && (
                        <span className="text-[10px] text-brand-400 font-bold hidden sm:inline">
                          {dayNotices.length} event{dayNotices.length > 1 ? 's' : ''}
                        </span>
                      )}
                    </div>

                    {/* Notice Mini-pills */}
                    <div className="space-y-1 mt-1 overflow-hidden">
                      {dayNotices.slice(0, 2).map(n => (
                        <div
                          key={n.id}
                          onClick={(e) => {
                            e.stopPropagation();
                            onSelectNotice(n);
                          }}
                          className={`text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded truncate font-medium border ${getCategoryBadge(n.category)}`}
                          title={n.title}
                        >
                          {n.title}
                        </div>
                      ))}
                      {dayNotices.length > 2 && (
                        <span className="text-[9px] text-slate-400 font-medium block">
                          +{dayNotices.length - 2} more
                        </span>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Day Detail Side Popup */}
          {selectedDayEvents && (
            <div className="p-5 rounded-2xl bg-navy-900 border border-brand-500/40 shadow-xl space-y-4 animate-in fade-in">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-xs text-brand-400 font-semibold uppercase tracking-wider">Scheduled on</span>
                  <h3 className="font-bold text-white text-lg">{selectedDayEvents.date}</h3>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => onAddNoticeForDate(selectedDayEvents.date)}
                    className="px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold flex items-center gap-1"
                  >
                    <Icon name="plus" className="w-3.5 h-3.5" />
                    <span>Add Notice for this Date</span>
                  </button>
                  <button
                    onClick={() => setSelectedDayEvents(null)}
                    className="p-1 rounded-lg text-slate-400 hover:text-white"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {selectedDayEvents.notices.map(n => (
                  <div
                    key={n.id}
                    onClick={() => onSelectNotice(n)}

    // 8. ADD NOTICE (SMART AI INPUT) COMPONENT

            venue: result.venue || prev.venue,
            description: result.description || prev.description,

            organizer: result.organizer || prev.organizer,

    // ==========================================
    // 9. AI WEEKLY SUMMARY COMPONENT
    // ==========================================
    function WeeklySummarySection({ notices, geminiApiKey, currentDateStr, addToast, onSelectNotice, getCategoryBadge }) {
      const [isGenerating, setIsGenerating] = useState(false);
      const [summaryData, setSummaryData] = useState(null);
      const [checklist, setChecklist] = useState([]);
      const [isSpeaking, setIsSpeaking] = useState(false);

      // Filter next 7 days announcements
      const weekNotices = useMemo(() => {
        const ref = new Date(currentDateStr);
        const end = new Date(ref);
        end.setDate(ref.getDate() + 7);

        return notices.filter(n => {
          if (!n.date) return false;
          const d = new Date(n.date);
          return d >= ref && d <= end;
        });
      }, [notices, currentDateStr]);

      // Generate Summary
      const generateSummary = async () => {
        setIsGenerating(true);
        // Small delay for UX
        await new Promise(r => setTimeout(r, 600));

        try {
          const urgent = weekNotices.filter(n => n.priority === "Urgent");
          const exams = weekNotices.filter(n => n.category === "Examination");
          const assignments = weekNotices.filter(n => n.category === "Academic" && /assignment|homework|submission|lab/i.test(n.title + " " + n.description));
          const placements = weekNotices.filter(n => n.category === "Placement");
          const events = weekNotices.filter(n => ["Events", "Sports", "Cultural"].includes(n.category));

          const takeaways = [
            `You have ${weekNotices.length} critical items scheduled for this week (Oct 31 - Nov 07).`,
            urgent.length > 0 ? `🚨 ${urgent.length} urgent notices requiring immediate physical action or clearance.` : null,
            exams.length > 0 ? `📝 Mid-Semester examinations begin on ${exams[0].date}. Hall ticket deadline is ${exams[0].deadline || "approaching"}.` : null,
            assignments.length > 0 ? `💻 Assignment submission due on ${assignments[0].date}.` : null,
            placements.length > 0 ? `💼 High-value internship recruitment drive active.` : null
          ].filter(Boolean);

          const items = [];
          weekNotices.forEach((n, idx) => {
            if (n.deadline) {
              items.push({ id: `chk-${idx}`, title: `Submit: ${n.title}`, deadline: n.deadline, completed: false });
            } else if (n.priority === "Urgent") {
              items.push({ id: `chk-${idx}`, title: `Action: ${n.title}`, deadline: n.date, completed: false });
            }
          });

          const data = {
            period: "Upcoming 7 Days (Oct 31 – Nov 07, 2026)",
            engine: geminiApiKey ? "Google Gemini 1.5 Flash (Live AI Connected)" : "Smart Campus Intelligence Engine (Demo Mode)",
            executiveOverview: `This week is heavily front-loaded with academic deadlines and recruitment registrations. Your highest priorities are the Biometric Attendance (Today) and the CS302 Assignment (Nov 02), followed closely by Mid-Semester exam preparation starting Nov 05.`,
            takeaways,
            urgent,
            exams,
            assignments,
            placements,
            events
          };

          setSummaryData(data);
          setChecklist(items);
          addToast("AI Weekly Summary generated from current announcements!", "success");
        } catch (e) {
          addToast("Failed to generate summary", "error");
        } finally {
          setIsGenerating(false);
        }
      };

      // Auto-generate on first load
      useEffect(() => {
        generateSummary();
      }, [weekNotices.length]);

      // Text-To-Speech Readout
      const toggleSpeech = () => {
        if (!('speechSynthesis' in window)) {
          addToast("Text-to-Speech not supported in this browser", "info");
          return;
        }

        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
          return;
        }

        if (!summaryData) return;

        const speechText = `Here is your campus briefing for this week. ${summaryData.executiveOverview} ` +
          summaryData.takeaways.join('. ') + 
          (summaryData.urgent.length > 0 ? ` Warning: You have ${summaryData.urgent.length} urgent notices.` : '');

        const utterance = new SpeechSynthesisUtterance(speechText);
        utterance.rate = 1.0;
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);
        
        setIsSpeaking(true);
        window.speechSynthesis.speak(utterance);
      };

      // Copy formatted summary for WhatsApp/Notes
      const copyToClipboard = () => {
        if (!summaryData) return;
        const text = `📌 *CAMPUS PULSE - WEEKLY BRIEFING* (${summaryData.period})\n\n` +
          `*Executive Summary:*\n${summaryData.executiveOverview}\n\n` +
          `*Key Takeaways:*\n${summaryData.takeaways.map(t => `• ${t}`).join('\n')}\n\n` +
          `*Action Checklist:*\n${checklist.map(c => `[ ] ${c.title} (Due: ${c.deadline})`).join('\n')}\n\n` +
          `Generated via Campus Pulse Hub`;

    function SettingsSection({ settings, onSaveSettings, onResetData, onClearAll, noticesCount, addToast }) {

      const [isTestingKey, setIsTestingKey] = useState(false);
      const [keyTestStatus, setKeyTestStatus] = useState(null);

      const handleTestKey = async () => {
        if (!form.geminiApiKey.trim()) {
          addToast("Enter a Gemini API key first to test!", "warning");
          return;
        }

        setIsTestingKey(true);
        setKeyTestStatus(null);
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${form.geminiApiKey.trim()}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: "Hello! Reply with 'OK'." }] }]
            })
          });

          if (res.ok) {
            setKeyTestStatus({ success: true, message: "Gemini 1.5 Flash Connected Successfully!" });
            addToast("Gemini API connection verified!", "success");
          } else {
            const err = await res.json().catch(() => ({}));
            setKeyTestStatus({ success: false, message: `API Error ${res.status}: ${err.error?.message || "Invalid API Key"}` });
            addToast("Invalid API Key", "error");
          }
        } catch (e) {
          setKeyTestStatus({ success: false, message: `Network error: ${e.message}` });
          addToast("Connection failed", "error");
        } finally {
          setIsTestingKey(false);
        }
      };

      const handleExportJSON = () => {
        const notices = JSON.parse(localStorage.getItem("campus_pulse_notices_v1") || "[]");
        const data = {
          exportedAt: new Date().toISOString(),
          version: "1.0",
          settings: form,
          announcements: notices
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `campus-pulse-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        addToast("Exported backup file (.json)", "success");
      };

      const handleImportJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              localStorage.setItem("campus_pulse_notices_v1", JSON.stringify(parsed));
              window.location.reload();
            } else if (parsed.announcements && Array.isArray(parsed.announcements)) {
              localStorage.setItem("campus_pulse_notices_v1", JSON.stringify(parsed.announcements));
              if (parsed.settings) {
                localStorage.setItem("campus_pulse_settings_v1", JSON.stringify(parsed.settings));
              }
              window.location.reload();
            } else {
              addToast("Invalid JSON file structure", "error");
            }
          } catch (err) {
            addToast("Error parsing JSON file", "error");
          }
        };
        reader.readAsText(file);
      };

      return (

              <label className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 flex items-center gap-1.5 cursor-pointer">
                <Icon name="upload" className="w-3.5 h-3.5" />
                <span>Import JSON</span>
                <input
                  type="file"
                  accept=".json"
                  onChange={handleImportJSON}
                  className="hidden"
                />
              </label>

              <button
                type="button"
                onClick={onClearAll}
                className="px-4 py-2 rounded-xl bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 text-xs font-semibold border border-rose-800/60"
              >
                Clear All Announcements
              </button>
            </div>

            <p className="text-xs text-slate-400">
              Currently holding <strong className="text-white">{noticesCount} announcements</strong> persistently in your browser's LocalStorage.
            </p>
          </div>

          {/* Save Button */}
          <div className="flex justify-end">
            <button
              type="button"
              onClick={() => onSaveSettings(form)}
              className="px-6 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold shadow-lg shadow-brand-500/20"
            >
              Save Settings
            </button>
          </div>
        </div>
      );
    }

    // Render the React application safely
    try {
      const rootElement = document.getElementById("root");
      if (rootElement && typeof ReactDOM !== 'undefined') {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<CampusPulseApp />);
      }
    } catch (err) {
      console.error("Initialization Error:", err);
      const rootEl = document.getElementById("root");
      if (rootEl) {
        rootEl.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;font-family:sans-serif;text-align:center;color:#e2e8f0;">
            <div style="max-width:480px;background:#0F1A3A;padding:32px;border-radius:16px;border:1px solid rgba(244,63,94,0.4);">
              <h3 style="color:#F43F5E;font-size:20px;font-weight:bold;margin-bottom:8px;">Application Notice</h3>
              <p style="font-size:14px;color:#cbd5e1;line-height:1.5;">${err.message}</p>
              <button onclick="window.location.reload()" style="margin-top:16px;padding:8px 16px;background:#3B82F6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">
                Reload Application
              </button>
            </div>
          </div>
        `;
      }
    }
  </script>
  <script>
    // Failsafe check for CDN connection
    setTimeout(function() {
      var rootEl = document.getElementById("root");
      if (rootEl && rootEl.innerHTML.indexOf("Starting Campus Pulse...") !== -1) {
        if (!window.React || !window.ReactDOM || !window.Babel) {
          rootEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;font-family:sans-serif;text-align:center;color:#e2e8f0;"><div style="max-width:480px;background:#0F1A3A;padding:32px;border-radius:16px;border:1px solid rgba(59,130,246,0.3);"><h3 style="color:#38BDF8;font-size:18px;font-weight:bold;margin-bottom:8px;">Connecting to CDN Libraries</h3><p style="font-size:13px;color:#94a3b8;line-height:1.6;">Please ensure your internet connection is active so standard React and Tailwind CDN scripts can load. Then refresh this page.</p><button onclick="window.location.reload()" style="margin-top:16px;padding:8px 16px;background:#3B82F6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Retry Now</button></div></div>';
        }
      }
    }, 4000);
  </script>
</body>
</html>
